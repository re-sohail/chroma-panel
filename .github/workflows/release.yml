name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    # GitHub-hosted runner required: npm's OIDC trusted publishing does not
    # support self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: write        # changesets pushes the version PR and tags
      pull-requests: write
      id-token: write        # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm i -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - run: npm run verify:directives
      - run: npm run size

      # Trusted publishing cannot create a package that does not exist yet:
      # the trusted publisher is configured on the package's own settings page,
      # so the package has to be published once by hand first. Until then OIDC
      # has no permission for the name and npm answers PUT with a 404.
      # See https://github.com/npm/cli/issues/8544
      #
      # This check skips the release step until that first manual publish has
      # happened, so pushes to main stop failing for a reason nobody can fix
      # from CI. It starts working on its own afterwards.
      - name: Has the package been published yet?
        id: exists
        run: |
          if npm view chroma-panel version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::chroma-panel is not on the registry yet. Publish 0.1.0 manually once, then configure the trusted publisher; this job will take over from the next release."
          fi

      - uses: changesets/action@v1
        if: steps.exists.outputs.published == 'true'
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately no NPM_TOKEN. Authentication is OIDC trusted
          # publishing, configured on npmjs.com against this workflow file.
          # npm revoked all classic tokens in December 2025, and granular
          # tokens lose publish rights in January 2027.
